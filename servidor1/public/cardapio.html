<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio | Lanchonete</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="cardapio.js" defer></script>
</head>
<body>
    <header>
        <a class="marca" href="cardapio.html">Lanchonete</a>
        <nav aria-label="Navegação principal">
            <a href="cardapio.html" aria-current="page">Cardápio</a>
            <a href="pedidos.html">Pedidos</a>
        </nav>
    </header>
    <main>
        <div class="cabecalho-conteudo">
            <h1>Cardápio</h1>
            <button id="atualizar-cardapio" type="button">Atualizar cardápio</button>
        </div>
        <p id="aviso-catalogo" role="status" aria-live="polite">Carregando o cardápio…</p>
        <form id="formulario-pedido">
            <div class="area-tabela">
                <table aria-label="Produtos disponíveis">
                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Produto</th>
                            <th scope="col">Preço</th>
                            <th scope="col">Estoque</th>
                            <th scope="col">Quantidade</th>
                        </tr>
                    </thead>
                    <tbody id="produtos"></tbody>
                </table>
            </div>
            <div class="finalizar-pedido">
                <div>
                    <label for="nome-cliente">Seu nome</label>
                    <input id="nome-cliente" name="NomeCliente" type="text" required maxlength="100" autocomplete="name">
                </div>
                <button id="enviar-pedido" type="submit" disabled>Fazer pedido</button>
            </div>
        </form>
        <p id="mensagem-resultado" role="status" aria-live="polite"></p>
    </main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos | Lanchonete</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="pedidos.js" defer></script>
</head>
<body>
    <header>
        <a class="marca" href="cardapio.html">Lanchonete</a>
        <nav aria-label="Navegação principal">
            <a href="cardapio.html">Cardápio</a>
            <a href="pedidos.html" aria-current="page">Pedidos</a>
        </nav>
    </header>
    <main>
        <div class="cabecalho-conteudo">
            <h1>Pedidos</h1>
            <button id="atualizar-pedidos" type="button">Atualizar pedidos</button>
        </div>
        <p id="aviso-pedidos" role="status" aria-live="polite">Carregando os pedidos…</p>
        <div class="area-tabela">
            <table aria-label="Pedidos em aberto">
                <thead>
                    <tr>
                        <th scope="col">Número</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Itens</th>
                        <th scope="col">Total</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody id="pedidos"></tbody>
            </table>
        </div>
        <p id="mensagem-resultado" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
